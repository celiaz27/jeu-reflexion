<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Jeu</title>

    <style>
        body{
            margin:0;
            padding:0;
            font-family:Arial, sans-serif;
            text-align:center;
            color:white;
            background-image:url('images/fond2.jpg');
            background-size:cover;
            background-position:center;
            height:100vh;
        }

        h1{
            margin-top:40px;
            font-size:70px;
            color:#ff00cc;
            text-shadow:0 0 10px #ff00cc, 0 0 25px #ff00cc;
        }

        .ligne{
            width:500px;
            height:3px;
            background:#ff00cc;
            margin:auto;
            box-shadow:0 0 15px #ff00cc;
        }

        .box{
            width:600px;
            margin:40px auto;
            padding:40px;
            border:2px solid #ff00cc;
            border-radius:20px;
            box-shadow:0 0 20px #ff00cc;
            background:rgba(0,0,0,0.55);
        }

        h2{
            color:#ff00cc;
            font-size:40px;
            text-shadow:0 0 10px #ff00cc;
        }

        .message{
            margin:25px auto;
            width:80%;
            padding:18px;
            border:1px solid #ff00cc;
            border-radius:10px;
            font-size:24px;
        }

        input{
            width:70%;
            padding:18px;
            font-size:22px;
            border-radius:10px;
            border:1px solid #ff00cc;
            background:black;
            color:white;
            text-align:center;
        }

        button,a{
            display:inline-block;
            margin:15px;
            padding:15px 35px;
            font-size:22px;
            border-radius:12px;
            border:2px solid #ff00cc;
            background:black;
            color:#ff00cc;
            text-decoration:none;
            cursor:pointer;
            box-shadow:0 0 15px #ff00cc;
        }

        button:hover,a:hover{
            background:#ff00cc;
            color:black;
        }
    </style>

</head>
<body>

<h1>JEU DE RÉFLEXION</h1>

<div class="ligne"></div>

<div class="box">

    <h2>JEU COMMENCÉ</h2>

    <p style="font-size:22px;color:white;">
        Tentatives :
        <span th:text="${tries != null ? tries : 0}"></span>
    </p>

    <div class="message" th:text="${message}"></div>

    <!-- FORM -->
    <form th:action="@{/guess}" method="post">
        <input type="number" name="number" placeholder="Entrez votre nombre..." required>
        <br><br>
        <button type="submit">VALIDER</button>
    </form>

    <br>

    <!-- SAVE -->
    <a th:href="@{/save}">SAUVEGARDER</a>

    <br><a th:href="@{/top}">VOIR LE CLASSEMENT 🏆</a>
    <br><br>

    <!-- REJOUER -->
    <a th:href="@{/}">REJOUER</a>

</div>

</body>
</html>
